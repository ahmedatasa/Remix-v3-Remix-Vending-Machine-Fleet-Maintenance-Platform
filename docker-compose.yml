services:
  postgres:
    image: postgres:16-alpine
    container_name: vending_fleet_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vending_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vending_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-vending_fleet_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vending_admin} -d ${POSTGRES_DB:-vending_fleet_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vending_network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: vending_fleet_backend
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-vending_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vending_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-vending_fleet_db}
      SECRET_KEY: ${SECRET_KEY:-super-secret-vending-platform-key-2026-production-grade-jwt-token}
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      REFRESH_TOKEN_EXPIRE_DAYS: 7
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
    networks:
      - vending_network

volumes:
  postgres_data:
    driver: local

networks:
  vending_network:
    driver: bridge
